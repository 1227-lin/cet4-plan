<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="四级计划">
<meta name="theme-color" content="#2E6B5A">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>四级冲刺计划表 · 2026.12</title>
<style>
  :root{
    --bg:#F6F3EC; --card:#FFFDF8; --ink:#211E1A; --muted:#8B8377; --line:#E7E1D4;
    --accent:#2E6B5A; --accent-soft:#EAF2EC; --warn:#B4603A;
    --p1:#2E6B5A; --p1bg:#EAF2EC; --p2:#9A5B25; --p2bg:#FBEFE0;
    --p3:#574C8E; --p3bg:#EDEAF6; --p4:#A63D30; --p4bg:#FBE7E4; --px:#3A3A3A; --pxbg:#ECECEC;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#171614; --card:#201E1B; --ink:#EDE8DE; --muted:#9A9388; --line:#332F29;
      --accent:#6FBF9F; --accent-soft:#1E332B;
      --p1:#6FBF9F; --p1bg:#1E332B; --p2:#D9A05B; --p2bg:#332618;
      --p3:#A99BE0; --p3bg:#262238; --p4:#E08A7C; --p4bg:#38211D; --px:#CCC; --pxbg:#2A2A2A;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:15px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-variant-numeric:tabular-nums}

  /* top bar */
  .top{
    position:sticky; top:0; z-index:20;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .top-in{max-width:880px;margin:0 auto;padding:12px 20px}
  .top-row{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  .brand{font-weight:650;letter-spacing:.3px}
  .brand span{color:var(--muted);font-weight:400;margin-left:6px;font-size:13px}
  .stats{margin-left:auto;display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
  .stats b{color:var(--ink);font-size:15px}
  .bar{height:4px;background:var(--line);border-radius:99px;margin-top:10px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}

  main{max-width:880px;margin:0 auto;padding:22px 20px 80px}

  /* today card */
  .today{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px;margin-bottom:26px;
    box-shadow:0 1px 2px rgba(0,0,0,.03),0 8px 24px -16px rgba(0,0,0,.18);
  }
  .today h2{margin:0 0 2px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .today .date{color:var(--muted);font-size:13px;margin-bottom:14px}
  .chip{
    display:inline-block;font-size:11px;line-height:1.7;padding:1px 8px;border-radius:99px;
    font-weight:600;letter-spacing:.2px;
  }
  .chip.p1{color:var(--p1);background:var(--p1bg)}
  .chip.p2{color:var(--p2);background:var(--p2bg)}
  .chip.p3{color:var(--p3);background:var(--p3bg)}
  .chip.p4{color:var(--p4);background:var(--p4bg)}
  .chip.px{color:var(--px);background:var(--pxbg)}
  .chip.now{color:var(--accent);background:var(--accent-soft)}

  .task{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
  .task:first-of-type{border-top:none}
  .task input{
    appearance:none;flex:0 0 18px;width:18px;height:18px;margin-top:2px;
    border:1.6px solid #B9B1A2;border-radius:5px;background:transparent;cursor:pointer;
    position:relative;transition:.15s;
  }
  .task input:checked{background:var(--accent);border-color:var(--accent)}
  .task input:checked::after{
    content:"";position:absolute;left:4.5px;top:1.5px;width:5px;height:9px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg);
  }
  .task{cursor:pointer}
  .task .t{flex:1}
  .task .t small{color:var(--muted);margin-left:6px;font-size:12px}
  .task.done .t span{color:var(--muted);text-decoration:line-through}

  .timer{display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);flex-wrap:wrap}
  .timer .clock{font-size:22px;font-weight:650;letter-spacing:1px;min-width:78px}
  .timer button{
    font:inherit;font-size:13px;padding:5px 12px;border-radius:8px;cursor:pointer;
    border:1px solid var(--line);background:var(--card);color:var(--ink);transition:.15s;
  }
  .timer button:hover{border-color:var(--accent);color:var(--accent)}
  .timer .hint{color:var(--muted);font-size:12px;margin-left:auto}

  textarea.note{
    width:100%;margin-top:12px;min-height:52px;resize:vertical;font:inherit;font-size:13px;
    color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;
    padding:9px 11px;outline:none;
  }
  textarea.note:focus{border-color:var(--accent)}

  /* weeks */
  details.week{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
  details.week>summary{
    list-style:none;cursor:pointer;padding:13px 18px;display:flex;align-items:center;gap:10px;
    font-weight:600;user-select:none;
  }
  details.week>summary::-webkit-details-marker{display:none}
  details.week>summary .caret{color:var(--muted);transition:.2s;font-size:12px}
  details.week[open]>summary .caret{transform:rotate(90deg)}
  details.week>summary .wbar{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}
  .days{padding:0 18px 10px}

  .day{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:13px 0;border-top:1px solid var(--line)}
  .day.today{background:linear-gradient(90deg,var(--accent-soft),transparent 70%);border-radius:8px;padding-left:10px;margin-left:-10px}
  .day.past .d-date{opacity:.75}
  .d-date{font-size:13px;line-height:1.45;padding-top:1px}
  .d-date b{display:block;font-weight:600;font-size:14px}
  .d-date span{color:var(--muted);font-size:12px}
  .day .tip{font-size:12px;color:var(--warn);margin-top:6px;line-height:1.5}
  .day .task{padding:5px 0}

  /* why / footer */
  .why{margin-top:34px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
  .why h3{margin:0 0 10px;font-size:15px}
  .why p{color:var(--muted);font-size:13px;margin:8px 0}
  table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0 4px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500}
  td.r{text-align:right}
  .foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
  .foot button{
    font:inherit;font-size:13px;padding:7px 14px;border-radius:9px;cursor:pointer;
    border:1px solid var(--line);background:transparent;color:var(--muted);
  }
  .foot button:hover{color:var(--warn);border-color:var(--warn)}
  .foot .sp{margin-left:auto;color:var(--muted);font-size:12px;align-self:center}

  .empty{color:var(--muted);font-size:13px;padding:8px 0}

  /* iPad / iOS 触控优化 */
  html{-webkit-text-size-adjust:100%}
  body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
  button,input,label,summary,textarea{touch-action:manipulation}
  .task{min-height:46px;padding:11px 0}
  .task input{flex:0 0 22px;width:22px;height:22px;margin-top:1px;border-radius:6px}
  .task input:checked::after{left:5.5px;top:2px;width:6px;height:11px}
  .timer button,.foot button{min-height:44px;padding:9px 16px}
  details.week>summary{min-height:54px}
  textarea.note{font-size:16px;min-height:66px}
  .top-in{padding-top:calc(12px + env(safe-area-inset-top))}
  main{padding-bottom:calc(90px + env(safe-area-inset-bottom))}

  @media (max-width:600px){
    .day{grid-template-columns:1fr;gap:6px}
    .d-date b{display:inline;font-size:13px}
    .d-date span{margin-left:6px}
    .stats{gap:12px;font-size:12px}
    main{padding:16px 14px 70px}
  }
  @media print{
    .top{position:static}
    .timer,.foot,textarea.note{display:none}
    details.week{break-inside:avoid;border-color:#ccc}
    body{background:#fff}
  }
</style>
</head>
<body>

<div class="top">
  <div class="top-in">
    <div class="top-row">
      <div class="brand">四级冲刺<span>2026-10-22 → 2026-12-19</span></div>
      <div class="stats">
        <div>D-<b class="num" id="s-days">–</b> 天</div>
        <div>完成 <b class="num" id="s-done">0</b>/<b class="num" id="s-total">0</b></div>
        <div>连续 <b class="num" id="s-streak">0</b> 天</div>
        <div>投入 <b class="num" id="s-min">0</b> 分钟</div>
      </div>
    </div>
    <div class="bar"><i id="s-bar" style="width:0%"></i></div>
  </div>
</div>

<main>
  <section class="today" id="today"></section>
  <section class="weeks" id="weeks"></section>

  <section class="why">
    <h3>为什么这么排：425 分的账</h3>
    <table>
      <thead><tr><th>板块</th><th class="r">满分</th><th class="r">目标正确率</th><th class="r">得分</th></tr></thead>
      <tbody>
        <tr><td>写作</td><td class="r num">106.5</td><td class="r">70%</td><td class="r num">75</td></tr>
        <tr><td>翻译</td><td class="r num">106.5</td><td class="r">65%</td><td class="r num">69</td></tr>
        <tr><td>阅读</td><td class="r num">248.5</td><td class="r">78%</td><td class="r num">194</td></tr>
        <tr><td>听力</td><td class="r num">248.5</td><td class="r">35%</td><td class="r num">87</td></tr>
        <tr><td><b>合计</b></td><td class="r num"><b>710</b></td><td class="r">—</td><td class="r num"><b>425</b></td></tr>
      </tbody>
    </table>
    <p>听力只需要 35%——25 道题里对 9 道。所以计划里听力的权重很小，只精听 Section B 和 C，短篇新闻直接跳过。阅读和写作才是你过线的地方。</p>
    <p>每天 40 分钟左右，周日轻量复盘，模考两次（12/5、12/12）。做不完不算失败，周日就是留给欠账的。</p>

    <div class="foot">
      <button id="btn-export">导出进度</button>
      <button id="btn-import">导入备份</button>
      <button id="btn-print">打印成纸</button>
      <button id="btn-reset">清空进度</button>
      <input type="file" id="file-import" accept="application/json,.json" hidden>
      <span class="sp">进度只存在这台设备上，不联网</span>
    </div>
  </section>
</main>

const save = s => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} };
let state = load();
state.done = state.done || {};
state.notes = state.notes || {};

const pad = n => String(n).padStart(2, '0');
const todayISO = () => {
  const d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
};
const tkey = (day, idx) => day.date + '#' + idx;
const weekOf = n => Math.floor((n - 1) / 7) + 1;

function stats() {
  let total = 0, done = 0, min = 0;
  for (const day of PLAN.days) {
    day.tasks.forEach((t, i) => {
      total++;
      if (state.done[tkey(day, i)]) { done++; min += t.min; }
    });
  }
  return { total, done, min };
}

  const t = todayISO();
  let n = 0;
  for (let k = PLAN.days.length - 1; k >= 0; k--) {
    const day = PLAN.days[k];
    if (day.date > t) continue;
    const ok = day.tasks.some((_, i) => state.done[tkey(day, i)]);
    if (ok) n++;
    else if (day.date < t) break;
  }
  return n;
}

function daysLeft() {
  const exam = new Date(PLAN.exam + 'T00:00:00');
  const now = new Date(todayISO() + 'T00:00:00');
  return Math.max(0, Math.round((exam - now) / 86400000));
}

/* ---------- 渲染 ---------- */
function renderStats() {
  const { total, done, min } = stats();
  document.getElementById('s-total').textContent = total;
  document.getElementById('s-done').textContent = done;
  document.getElementById('s-min').textContent = min;
  document.getElementById('s-days').textContent = daysLeft();
  document.getElementById('s-streak').textContent = streak();
  document.getElementById('s-bar').style.width = (total ? done / total * 100 : 0).toFixed(1) + '%';
}

function taskEl(day, t, i) {
  const k = tkey(day, i);
  const wrap = document.createElement('label');
  wrap.className = 'task' + (state.done[k] ? ' done' : '');
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.dataset.k = k;
  cb.checked = !!state.done[k];
  cb.addEventListener('change', () => {
    if (cb.checked) state.done[k] = true; else delete state.done[k];
    save(state);
    document.querySelectorAll('input[data-k="' + k + '"]').forEach(o => {
      o.checked = cb.checked;
      o.closest('.task').classList.toggle('done', cb.checked);
    });
    renderStats();
    renderWeekBars();
  });
  const text = document.createElement('span');
  text.className = 't';
  const span = document.createElement('span');
  span.textContent = t.label;
  text.appendChild(span);
  if (t.min) {
    const small = document.createElement('small');
    small.textContent = t.min + '′';
    text.appendChild(small);
  }
  wrap.appendChild(cb);
  wrap.appendChild(text);
  return wrap;
}

function renderToday() {
  const t = todayISO();
  const host = document.getElementById('today');
  host.innerHTML = '';
  let day = PLAN.days.find(d => d.date === t);
  if (!day) {
    const past = PLAN.days.filter(d => d.date < t);
    host.innerHTML = '<h2>计划里的今天</h2><div class="empty">' +
      (past.length ? '今天是复盘日或已经过了计划期。翻下面的周视图补欠账。' : '计划还没开始，第一天是 ' + PLAN.days[0].date + '。') +
      '</div>';
    return;
  }
  const h = document.createElement('h2');
  h.appendChild(document.createTextNode('今天的任务 '));
  const chip = document.createElement('span');
  chip.className = 'chip ' + day.color;
  chip.textContent = day.phaseName;
  h.appendChild(chip);
  host.appendChild(h);
  const dt = document.createElement('div');
  dt.className = 'date num';
  dt.textContent = day.date + ' · ' + day.wd + ' · 第 ' + day.week + ' 周';
  host.appendChild(dt);

  day.tasks.forEach((task, i) => host.appendChild(taskEl(day, task, i)));

  if (day.tip) {
    const tip = document.createElement('div');
    tip.className = 'tip';
    tip.textContent = '· ' + day.tip;
    host.appendChild(tip);
  }

  // 计时器
  const tm = document.createElement('div');
  tm.className = 'timer';
  const clock = document.createElement('div');
  clock.className = 'clock num';
  clock.id = 'clock';
  clock.textContent = '40:00';
  const startBtn = document.createElement('button');
  startBtn.id = 'btn-start';
  startBtn.textContent = '开始';
  const resetBtn = document.createElement('button');
  resetBtn.id = 'btn-reset-t';
  resetBtn.textContent = '重置';
  const hint = document.createElement('span');
  hint.className = 'hint';
  hint.textContent = '40 分钟，一次只做一件事';
  tm.appendChild(clock);
  tm.appendChild(startBtn);
  tm.appendChild(resetBtn);
  tm.appendChild(hint);
  host.appendChild(tm);
  bindTimer(host);

  // 随记
  const note = document.createElement('textarea');
  note.className = 'note';
  note.placeholder = '今天记一句：错了哪道、为什么错（写"粗心"不算）';
  note.value = state.notes[day.date] || '';
  note.addEventListener('input', () => { state.notes[day.date] = note.value; save(state); });
  host.appendChild(note);
}

function bindTimer(host) {
  let left = 40 * 60, timer = null, running = false;
  const clock = host.querySelector('#clock');
  const btn = host.querySelector('#btn-start');
  const draw = () => {
    clock.textContent = pad(Math.floor(left / 60)) + ':' + pad(left % 60);
    clock.style.color = left <= 60 ? 'var(--warn)' : '';
  };
  const tick = () => {
    left--;
    draw();
    if (left <= 0) { stop(); clock.textContent = '完成'; }
  };
  const stop = () => { running = false; clearInterval(timer); btn.textContent = '开始'; };
  btn.addEventListener('click', () => {
    if (running) { stop(); return; }
    running = true; btn.textContent = '暂停';
    timer = setInterval(tick, 1000);
  });
  host.querySelector('#btn-reset-t').addEventListener('click', () => {
    stop(); left = 40 * 60; draw();
  });
  draw();
}

function renderWeekBars() {
  for (const sec of document.querySelectorAll('details.week')) {
    const w = Number(sec.dataset.week);
    const days = PLAN.days.filter(d => d.week === w);
    let total = 0, done = 0;
    days.forEach(day => day.tasks.forEach((_, i) => { total++; if (state.done[tkey(day, i)]) done++; }));
    const el = sec.querySelector('.wbar');
    if (el) el.textContent = done + '/' + total;
  }
}

function renderWeeks() {
  const host = document.getElementById('weeks');
  host.innerHTML = '';
  const t = todayISO();
  const weeks = [...new Set(PLAN.days.map(d => d.week))];

  for (const w of weeks) {
    const days = PLAN.days.filter(d => d.week === w);
    const det = document.createElement('details');
    det.className = 'week';
    det.dataset.week = w;
    det.open = days.some(d => d.date === t);

    const ph = days[0];
    const sum = document.createElement('summary');
    const caret = document.createElement('span');
    caret.className = 'caret';
    caret.textContent = '▶';
    const wlabel = document.createElement('span');
    wlabel.textContent = '第 ' + w + ' 周';
    const phchip = document.createElement('span');
    phchip.className = 'chip ' + ph.color;
    phchip.textContent = ph.phaseName;
    const wbar = document.createElement('span');
    wbar.className = 'wbar num';
    sum.appendChild(caret);
    sum.appendChild(wlabel);
    sum.appendChild(phchip);
    sum.appendChild(wbar);
    det.appendChild(sum);

    const box = document.createElement('div');
    box.className = 'days';
    for (const day of days) {
      const row = document.createElement('div');
      row.className = 'day' + (day.date === t ? ' today' : '') + (day.date < t ? ' past' : '');
      const dateCell = document.createElement('div');
      dateCell.className = 'd-date num';
      const b = document.createElement('b');
      b.textContent = day.date.slice(5);
      const wds = document.createElement('span');
      wds.textContent = day.wd + (day.date === t ? ' · 今天' : '');
      dateCell.appendChild(b);
      dateCell.appendChild(wds);
      row.appendChild(dateCell);

      const body = document.createElement('div');
      day.tasks.forEach((task, i) => body.appendChild(taskEl(day, task, i)));
      if (day.tip && day.i % 7 === 1) {
        const tip = document.createElement('div');
        tip.className = 'tip';
        tip.textContent = '· ' + day.tip;
        body.appendChild(tip);
      }
      row.appendChild(body);
      box.appendChild(row);
    }
    det.appendChild(box);
    host.appendChild(det);
  }
  renderWeekBars();
}

/* ---------- 操作 ---------- */
document.getElementById('btn-export').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), state }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '四级进度_' + todayISO() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
});
document.getElementById('btn-print').addEventListener('click', () => window.print());

document.getElementById('btn-import').addEventListener('click', () => {
  document.getElementById('file-import').click();
});
document.getElementById('file-import').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(String(reader.result));
      const st = data && data.state ? data.state : data;
      if (!st || typeof st !== 'object' || !st.done || typeof st.done !== 'object') throw new Error('不是这个计划的备份文件');
      if (!confirm('用这份备份覆盖当前的进度？')) return;
      state = { done: st.done, notes: st.notes || {} };
      save(state);
      renderToday(); renderWeeks(); renderStats();
      alert('已导入：' + Object.keys(state.done).length + ' 个打卡');
    } catch (err) {
      alert('读不出来：' + err.message);
    }
  };
  reader.readAsText(f);
  e.target.value = '';
});
document.getElementById('btn-reset').addEventListener('click', () => {
  if (!confirm('清空全部打卡和随记？这个动作不能撤销。')) return;
  state = { done: {}, notes: {} };
  save(state);
  renderToday(); renderWeeks(); renderStats();
});

/* ---------- 启动 ---------- */
renderToday();
renderWeeks();
renderStats();

if (!storageOK) {
  const sp = document.querySelector('.foot .sp');
  if (sp) {
    sp.textContent = '⚠ 这个浏览器不允许本地存储，刷新后进度会丢失';
    sp.style.color = 'var(--warn)';
  }
}

/* 线上（HTTPS）时启用离线缓存：装到主屏幕后断网也能用 */
if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator &&
    typeof location !== 'undefined' && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

const t = todayISO();
const todayRow = document.querySelector('.day.today');
if (todayRow) {
  const openSec = todayRow.closest('details');
  if (openSec) openSec.open = true;
}
</script>
</body>
